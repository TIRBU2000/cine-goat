<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cine-goat</title>
  </head>
  <body>
    <div id="app">
      
      <div class="search-section">
        <input
          id="search_input"
          type="text"
          placeholder="Entrez le nom d'un film"
        />
        <button id="search_btn">🔎</button>

        <button id="aller_log_btn">Log In/Sign Up</button>
        <span id="auth-status-dot" style="height: 10px; width: 10px; background-color: red; border-radius: 50%; display: inline-block; margin-right: 5px;"></span>
      </div>
      <div id="movies_grid"></div>
      <div id="movie-details-section" style="display: none"></div>
    </div>

    <div id="auth-section" style="display : none;"> <h2>Espace Utilisateur</h2>
    
    <input type ="email" id= "auth-email" placeholder="adresse email">
    <input type ="password" id = "auth-password" placeholder = "mot de passe">

    <button id = "login-btn">Se connecter</button>
    <button id = "signup-btn">S'inscrire</button>
    <button id = "retour-btn">Retour</button>
    <br>

    </div>

    <div id="message_r" class="message-box-r" style = "display : none">
    <p>Vous êtes maintenant connecter au CinéGOAT !</p>
    <button id="fermer-message-r">&times;</button>
    </div>
    <div id="message_e" class="message-box-e" style = "display : none">
    <p>Erreur lors de l'inscription/connexion veuillez réessayer !</p>
    <button id="fermer-message-e">&times;</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
